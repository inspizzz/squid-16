; Limpet-16 firmware for the Seeed Studio XIAO ESP32-S3
;   pio run -t upload        build and flash over USB-C
;   pio device monitor       serial log (115200 baud)
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -Wall
