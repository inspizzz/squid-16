; Limpet-16 firmware for the on-board ESP32-C3-WROOM-02 module
;   pio run -t upload        build and flash over the board's USB-C socket
;   pio device monitor       serial log
; The module's built-in USB port does both jobs; no USB-serial chip is needed.
[env:limpet16]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -Wall
